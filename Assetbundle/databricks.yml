# This is a Databricks asset bundle definition for Assetbundle.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: Assetbundle
  uuid: 3940e653-04e1-4f62-a734-30d916bc67cd

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

include:
  - resources/*.yml
  - resources/*/*.yml

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    presets:
      name_prefix: dev_${workspace.current_user.short_name}
      source_linked_deployment: false
    workspace:
      host: https://dbc-e59d5ee3-8fcf.cloud.databricks.com/

  prod:
    mode: production
    workspace:
      host: https://dbc-e59d5ee3-8fcf.cloud.databricks.com/
      # We explicitly deploy to /Workspace/Users/sundarg1303@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/sundarg1303@gmail.com/PROD/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - group_name: admins
        level: CAN_MANAGE
